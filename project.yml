name: Scroblytics
options:
  bundleIdPrefix: app.scroblytics
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: GZSS69ZNX8
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Scroblytics:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Scroblytics
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scroblytics.Scroblytics
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.9.22"
        CURRENT_PROJECT_VERSION: "23"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Config/Scroblytics.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Config/Info-extra.plist
        INFOPLIST_KEY_CFBundleDisplayName: Scroblytics
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    postBuildScripts:
      - name: Stamp debug build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/.git/HEAD
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/build-stamp.txt
        script: |
          # Debug builds only: note the git branch and the build time, shown at the top of the app's window.
          [ "${CONFIGURATION}" = "Debug" ] || exit 0
          head=""
          if [ -r "${SRCROOT}/.git/HEAD" ]; then IFS= read -r head < "${SRCROOT}/.git/HEAD"; fi
          case "$head" in
            "ref: refs/heads/"*) branch="${head#ref: refs/heads/}" ;;
            "") branch="unknown branch" ;;
            *) branch="no branch (commit $(printf '%.7s' "$head"))" ;;
          esac
          printf '%s\n%s\n' "$branch" "$(date +%s)" > "${SCRIPT_OUTPUT_FILE_0}"
schemes:
  Scroblytics:
    build:
      targets:
        Scroblytics: all
    run:
      config: Debug
    archive:
      config: Release
